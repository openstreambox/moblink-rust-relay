name: Build Release Binaries

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TOOLCHAIN: nightly-2026-05-25
  CARGO_TERM_COLOR: always

jobs:
  lockfile:
    name: Resolve dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.TOOLCHAIN }}

      # Cargo.lock is not committed, so resolve once with the release toolchain
      # and build, test and publish against the same versions.
      - name: Generate Cargo.lock
        run: cargo +$TOOLCHAIN generate-lockfile

      - uses: actions/upload-artifact@v7
        with:
          name: Cargo.lock
          path: Cargo.lock
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: lockfile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Only statically linked MUSL binaries are published - GNU builds pick up the
        # glibc of the build image and fail on older distros such as Ubuntu 22.04.
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - mips-unknown-linux-musl
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: Cargo.lock

      - name: Install prerequisites
        shell: bash
        run: |
          case ${{ matrix.target }} in
            x86_64-unknown-linux-musl) sudo apt-get -y update ; sudo apt-get -y install musl-tools ;;
            aarch64-unknown-linux-musl) sudo apt-get -y update ; sudo apt-get -y install gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu musl-tools ;;
            # cross builds inside its own image and the mips binaries are not
            # stripped, so no host tools are needed. Newer Ubuntu runner images
            # no longer ship gcc-mips-linux-gnu.
            mips-unknown-linux-musl) ;;
          esac

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          components: rust-src

      - name: Install cross
        run: cargo +$TOOLCHAIN install cross --git https://github.com/cross-rs/cross --rev c7dee4d008475ce1c140773cbcd6078f4b86c2aa --locked

      - name: Build
        shell: bash
        run: cross +$TOOLCHAIN build --locked --release --target=${{ matrix.target }} -Z build-std=std,panic_abort,core,alloc,proc_macro

      - name: Strip binaries
        shell: bash
        run: |
          case ${{ matrix.target }} in
            x86_64-unknown-linux-musl) strip_cmd=strip ;;
            aarch64-unknown-linux-musl) strip_cmd=aarch64-linux-gnu-strip ;;
            *) exit 0 ;;
          esac
          for bin in moblink-relay moblink-relay-service moblink-streamer; do
            $strip_cmd target/${{ matrix.target }}/release/$bin
          done

      - name: Package binaries
        shell: bash
        run: |
          mkdir dist
          for bin in moblink-relay moblink-relay-service moblink-streamer; do
            cp target/${{ matrix.target }}/release/$bin dist/$bin-${{ matrix.target }}
          done
          cd dist
          sha256sum moblink-* > SHA256SUMS-${{ matrix.target }}
          cat SHA256SUMS-${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: moblink-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  test:
    name: Tests against the x86_64 release binary
    needs: [lockfile, build]
    runs-on: ubuntu-latest
    env:
      MOBLINK_RELAY_BIN: ${{ github.workspace }}/dist/moblink-relay-x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: Cargo.lock

      - uses: actions/download-artifact@v8
        with:
          name: moblink-x86_64-unknown-linux-musl
          path: dist

      - name: Verify the release binary
        run: |
          cd dist
          sha256sum --check SHA256SUMS-x86_64-unknown-linux-musl
          # Artifacts do not keep file modes.
          chmod +x moblink-*

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.TOOLCHAIN }}

      - name: Unit tests and loopback failure tests
        run: cargo +$TOOLCHAIN test --locked

      # These change interfaces and addresses, so they run in a private network
      # namespace owned by an unprivileged user namespace, never on the runner's
      # own network.
      - name: Uplink failure tests in a network namespace
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Modules do not autoload from inside a user namespace. Without
          # numdummies=0 loading the driver would create dummy0 on the host.
          sudo modprobe dummy numdummies=0
          cargo +$TOOLCHAIN test --locked --test netns_failures --no-run
          MOBLINK_TEST_NETNS=1 unshare --map-root-user --net -- \
            sh -c "ip link set lo up && exec cargo +$TOOLCHAIN test --locked --offline --test netns_failures -- --ignored"

      - name: Upload relay logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relay-logs
          path: target/tmp/*.log
          if-no-files-found: ignore

  release:
    name: Publish release
    # Tag pushes only: a manual run against a tag must not publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [lockfile, build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for changelog

      - name: Get changelog
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            # If no previous tag, get all commits since the beginning
            CHANGELOG=$(git log --pretty=format:"- %s" "$TAG")
          else
            # Get commits between previous tag and current tag
            CHANGELOG=$(git log --pretty=format:"- %s" "$PREV_TAG..$TAG")
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
        with:
          pattern: moblink-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: Cargo.lock
          path: dist

      - name: Combine checksums
        run: |
          cd dist
          sha256sum --check SHA256SUMS-*
          cat SHA256SUMS-* > SHA256SUMS
          rm SHA256SUMS-*
          sha256sum Cargo.lock >> SHA256SUMS
          cat SHA256SUMS

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            # Release ${{ github.ref_name }}

            ## Binaries included:
            - moblink-relay
            - moblink-relay-service
            - moblink-streamer

            ## Architectures (all statically linked against MUSL, no glibc requirement):
            - x86_64 (MUSL)
            - ARM64 (MUSL)
            - MIPS (MUSL)

            `SHA256SUMS` lists the checksum of every file, and `Cargo.lock` the
            dependency versions the binaries were built with.

            ## Changelog
            ${{ steps.changelog.outputs.CHANGELOG }}
