name: Publish Crate

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    # The crate is owned and released by the canonical repository.
    if: github.repository == 'datagutt/moblink-rust'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true

      - name: Run tests
        run: cargo test --verbose

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
