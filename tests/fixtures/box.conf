[Unit]
RequiresMountsFor={state}
StartLimitIntervalSec=20s
StartLimitBurst=4

[Service]
NetworkNamespacePath=/proc/{pid}/ns/net
UMask=0077
KillMode=control-group
TimeoutStopSec=3s
RuntimeMaxSec=120s
LogRateLimitIntervalSec=10s
LogRateLimitBurst=100
Restart=on-failure
RestartSec=1s
RestartSteps=2
RestartMaxDelaySec=3s
ExecCondition=/usr/bin/grep -qx "v1 systemd" {owner}
ExecStartPre=/bin/sh -ec "if test -f \"$$1\"; then exit 0; fi; echo fixture-pre-start-failed; exit 1" sh {ready}
ExecStart=
ExecStart={binary} --password {password} --network-interfaces-to-allow {interfaces} --database {database} --runtime-status-file {status} --no-log-timestamps{streamer}
